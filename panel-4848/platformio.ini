; Основная прошивка для Guition ESP32-S3-4848S040 (4", 480x480, ST7701S + GT911).
;
;   pio run -t upload --upload-port COM10 && pio device monitor -p COM10
;
; Отрисовка (gfx, display_list, fonts) общая с табло HUB75 и берётся из
; ../firmware/src без копирования — так прошивка и серверное превью
; продолжают сверяться одним compare.py.
;
; Память — как в bringup-4848, проверено на плате: флеш quad, PSRAM octal.

[platformio]
default_envs = guition4848

[env:guition4848]
platform      = espressif32 @ 8.0.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800   ; CH340 на 921600 бьёт пакеты

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

build_src_filter =
    +<*>
    +<../../firmware/src/gfx.cpp>
    +<../../firmware/src/display_list.cpp>
    +<../../firmware/src/fonts.cpp>
    +<../../firmware/src/net.cpp>
    +<../../firmware/src/storage.cpp>

; Сеть и настройки — общие с HUB75. Им нужен firmware/src/secrets.h (не в git,
; создаётся из secrets.example.h). Настройки сети пишутся в NVS через Serial.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; порт идёт через CH340, а не через USB чипа
    -DCACHE_LITTLEFS              ; раскладка ~14 КБ — кэш файлом, в NVS не влезет
    -DOTA_HOSTNAME=\"panel-4848\"
    ; Пароль OTA — из Bitwarden через окружение (flash.ps1 запускает сборку с профилем,
    ; который подгружает секреты). Пусто — OTA выключено (net.cpp).
    -DOTA_PASSWORD=\"${sysenv.PANEL_4848_OTA_PASS}\"
    -I../firmware/src

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.9
    bblanchon/ArduinoJson @ ^7.1.0

; Прошивка по Wi-Fi: flash.ps1 -Project panel-4848 -Env guition4848_ota
[env:guition4848_ota]
extends         = env:guition4848
upload_protocol = espota
upload_port     = panel-4848.local
upload_flags    = --auth=${sysenv.PANEL_4848_OTA_PASS}
