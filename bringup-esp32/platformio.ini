; Минимальная прошивка для первого включения панели HUB75.
;
; Ничего, кроме панели: ни WiFi, ни сервера, ни шрифтов с кириллицей.
; Задача одна — выяснить, зажигается ли панель и верно ли подключена.
;
; Обычная панель 64x32:  pio run -e panel64x32 -t upload && pio device monitor
; Гибкий модуль P2:      pio run -e p2mod160x80 -t upload   (эксперимент, см. README)

[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps      = mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.9
; Распиновка берётся из основной прошивки, чтобы не разъезжалась.
build_flags   = -I../firmware/src

; --- Обычная панель 64x32, развёртка 1/16. Это «повторить тот проект». ---
[env:panel64x32]
extends     = common
build_flags =
    ${common.build_flags}
    -DPANEL_RES_X=64
    -DPANEL_RES_Y=32
    -DPANEL_CHAIN=1
    -DDRV_SHIFT=0        ; SHIFTREG  — обычный сдвиговый регистр столбцов
    -DDRV_LINE=0         ; TYPE138   — обычный дешифратор строк

; --- Гибкий модуль RX2.0-1515-160X80-40S. Проверка гипотезы, не рабочий режим. ---
[env:p2mod160x80]
extends     = common
build_flags =
    ${common.build_flags}
    -DPANEL_RES_X=160
    -DPANEL_RES_Y=80
    -DPANEL_CHAIN=1
    -DDRV_SHIFT=2        ; FM6126A — ближайший родственник FM6363B, самого его в библиотеке нет
    -DDRV_LINE=3         ; SM5266P — сдвиговый выбор строки, как у MW5566P
    -DCOLOR_DEPTH=5      ; 160x80 при 8 битах не помещается в память ESP32-WROOM

; --- Одна панель 128x64, развёртка 1/32. Требует подключённого вывода E. ---
[env:panel128x64]
extends     = common
build_flags =
    ${common.build_flags}
    -DPANEL_RES_X=128
    -DPANEL_RES_Y=64
    -DPANEL_CHAIN=1
    -DDRV_SHIFT=0
    -DDRV_LINE=0

; --- Две панели 64x64 в цепочке: та же картинка 128x64, но CHAIN=2. ---
[env:panel64x64x2]
extends     = common
build_flags =
    ${common.build_flags}
    -DPANEL_RES_X=64
    -DPANEL_RES_Y=64
    -DPANEL_CHAIN=2
    -DDRV_SHIFT=0
    -DDRV_LINE=0
