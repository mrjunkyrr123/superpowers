; Первое включение Guition ESP32-S3-4848S040 (4", 480x480, ST7701S + GT911).
;
;   pio run -t upload --upload-port COM10 && pio device monitor -p COM10
;
; Параметры памяти взяты из вывода esptool на реальной плате:
;   Flash: 16MB, quad          -> qio
;   Embedded PSRAM 8MB (AP)    -> octal (opi)
; Неверный memory_type — самая частая причина «PSRAM не найдена», а без
; PSRAM кадровый буфер 480x480 (460 КБ) не создать.

[env:guition4848]
platform      = espressif32 @ 8.0.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800   ; CH340 на 921600 бьёт пакеты (проверено на read-flash)

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; порт идёт через CH340, а не через USB чипа

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.9
