; Та же прошивка panel-4848, но с пересобранными библиотеками Arduino.
;
; Готовые библиотеки Arduino настроены плохо для RGB-экрана при работающем Wi-Fi:
; прерывание экрана не успевает за работой с флешем — на экране штрихи. У ESPHome
; (ESP-IDF) настройки другие, поэтому в Home Assistant этой беды нет. Решение и
; значения — проект KEGustafsson/signalk-esp32-gauges, такой же экран 480x480 ST7701.
;
; Собирать из PowerShell, не из Git Bash. Ядро — pioarduino==6.2.0 в своём окружении,
; core_dir короткий: длинный путь ломает сборку через час работы. Первая сборка ~1 час.
; Поменял строку custom_sdkconfig — удали sdkconfig.<env>, иначе останется старое значение.

[platformio]
default_envs = guition4848_idf
src_dir      = ../panel-4848/src
core_dir     = C:/pio21

[env:guition4848_idf]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800   ; CH340 на 921600 бьёт пакеты

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv   ; как в panel-4848 — можно обновить по воздуху

custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
    CONFIG_BT_ENABLED=n

; Общие файлы firmware/src кладёт рядом с main.cpp скрипт build.ps1 — собирать только им.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCACHE_LITTLEFS
    -DWIFI_ALWAYS_ON              ; радио включено всегда, как в Home Assistant
    -DOTA_HOSTNAME=\"panel-4848\"
    -DOTA_PASSWORD=\"${sysenv.PANEL_4848_OTA_PASS}\"

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.9
    bblanchon/ArduinoJson @ ^7.1.0

[env:guition4848_idf_ota]
extends         = env:guition4848_idf
upload_protocol = espota
upload_port     = panel-4848.local
upload_flags    = --auth=${sysenv.PANEL_4848_OTA_PASS}
