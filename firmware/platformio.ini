; Табло HUB75 64x32 на ESP32.
;
; Сборка:  pio run
; Прошивка: pio run -t upload && pio device monitor

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.9
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Разрешение панели. Для 128x64 поставьте 128/64/1 и подключите вывод E
    ; (см. panel_pins.h) — памяти ESP32-WROOM на это хватает с двойной
    ; буферизацией. Две панели 64x64 в цепочке дают то же самое при 64/64/2.
    -DPANEL_RES_X=64
    -DPANEL_RES_Y=32
    -DPANEL_CHAIN=1
