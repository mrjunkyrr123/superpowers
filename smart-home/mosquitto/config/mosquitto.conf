# Слушаем на всех интерфейсах, порт 1883
listener 1883

# Без анонимов. Пароли лежат в файле passwd (создаётся scripts/install.sh)
allow_anonymous false
password_file /mosquitto/config/passwd

# Хранить состояние между перезапусками
persistence true
persistence_location /mosquitto/data/

# Логи
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
